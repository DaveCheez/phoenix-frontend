# Reference production App Spec. Review domains and branch before applying.
name: phoenix-vanz-frontend
region: lon
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED

domains:
  - domain: phoenixvanz.com
    type: PRIMARY
  - domain: www.phoenixvanz.com
    type: ALIAS

envs:
  - key: NODE_ENV
    value: production
    scope: RUN_TIME
    type: GENERAL
  - key: NITRO_HOST
    value: 0.0.0.0
    scope: RUN_TIME
    type: GENERAL
  - key: NITRO_PORT
    value: "8080"
    scope: RUN_TIME
    type: GENERAL
  - key: NUXT_DJANGO_API_BASE
    value: https://api.phoenixvanz.com/api
    scope: RUN_TIME
    type: GENERAL
  - key: NUXT_PUBLIC_SITE_URL
    value: https://phoenixvanz.com
    scope: RUN_TIME
    type: GENERAL
  - key: NUXT_PUBLIC_CHECKOUT_ENABLED
    value: "false"
    scope: RUN_TIME
    type: GENERAL

services:
  - name: nuxt-web
    github:
      repo: DaveCheez/phoenix-vanz-frontend
      branch: master
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    health_check:
      http_path: /api/health
      initial_delay_seconds: 20
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 6
